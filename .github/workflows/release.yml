name: Release

# Al empujar una etiqueta vX.Y.Z arma el instalador y publica la release con el .exe y su SHA-256
# (la app los usa para actualizarse y verificar la descarga).
#
#   git tag v2.1.0
#   git push origin v2.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: La etiqueta tiene que coincidir con la versión del proyecto
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $csproj = [xml](Get-Content PBIExplorer.csproj)
          $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if ($tag -ne $version) { throw "La etiqueta v$tag no coincide con <Version> $version en PBIExplorer.csproj." }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Armar el instalador (corre los tests antes)
        shell: pwsh
        run: ./build-installer.ps1

      - name: Novedades de esta versión (del CHANGELOG)
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($env:VERSION))\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)"
          $match = [regex]::Match($text, $pattern)
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "Versión $env:VERSION." }
          Set-Content release-notes.md $notes -Encoding utf8

      - name: Publicar la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: PBI Layer ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            installer_output/PBILayer-Setup-${{ env.VERSION }}.exe
            installer_output/PBILayer-Setup-${{ env.VERSION }}.exe.sha256
