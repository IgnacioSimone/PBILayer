name: CI

# Compila y corre los tests en cada push y pull request.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # La app es WPF (net8.0-windows): solo compila en Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build PBIExplorer.csproj -c Release --no-restore

      - name: Tests
        run: dotnet test PBIExplorer.Tests -c Release --logger "trx;LogFileName=tests.trx"

      - name: Guardar resultados de los tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resultados-tests
          path: "**/tests.trx"
          if-no-files-found: ignore
